name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    name: Build Release APK
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Cleanup Workspace
        run: |
          echo "Cleaning up workspace before build..."
          rm -rf ./*
          rm -rf .[^.]*
          echo "Workspace cleaned"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Kill any existing Gradle processes
        run: |
          echo "Killing any existing Gradle processes..."
          pkill -9 -f gradle || true
          pkill -9 -f java.*gradle || true
          rm -f ~/.gradle/caches/*.lock ~/.gradle/*.lock || true
          echo "Gradle processes cleaned"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
          echo "Keystore decoded successfully"
          ls -la app/release.keystore

      - name: Create keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > app/keystore.properties << EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=release.keystore
          EOF
          echo "keystore.properties created:"
          cat app/keystore.properties | sed 's/Password=.*/Password=***/'

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon --build-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Xmx4096m"

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*versionName = "\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*versionCode = \(.*\)/\1/')
          BUILD_NUMBER=${{ github.run_number }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "versionCode=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "buildNumber=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "shortSha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Pikaso-v${{ steps.version.outputs.version }}-build.${{ steps.version.outputs.buildNumber }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pikaso-APK-${{ steps.version.outputs.buildNumber }}
          path: app/build/outputs/apk/release/Pikaso-*.apk
          retention-days: 30

      - name: Cleanup after build
        if: always()
        run: |
          echo "Stopping Gradle daemon..."
          ./gradlew --stop || true
          echo "Killing any remaining Gradle processes..."
          pkill -9 -f gradle || true
          pkill -9 -f java.*gradle || true
          echo "Cleanup completed"

  release:
    name: Create Release
    needs: build
    runs-on: self-hosted
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from build.gradle
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*versionName = "\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*versionCode = \(.*\)/\1/')
          BUILD_NUMBER=${{ github.run_number }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "versionCode=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "buildNumber=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "shortSha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: Pikaso-APK-*
          merge-multiple: false
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}+build.${{ steps.version.outputs.buildNumber }}
          name: Pikaso v${{ steps.version.outputs.version }} (Build #${{ steps.version.outputs.buildNumber }})
          body: |
            ## Pikaso v${{ steps.version.outputs.version }} - Build #${{ steps.version.outputs.buildNumber }}

            **提交**: ${{ steps.version.outputs.shortSha }}
            **版本代码**: ${{ steps.version.outputs.versionCode }}

            ### 下载
            - **APK**: 签名发布版本，直接安装到 Android 设备

            ### 系统要求
            - Android 8.0+ (API 26)
            - 推荐 2GB+ 内存

            ### 主要功能
            - AI 智能助手对话
            - Shizuku 高级权限管理
            - 文件管理工具
            - MCP 插件系统

            ### 最新更新
            本次构建包含自上次发布以来的所有提交。

            [查看完整提交历史](https://github.com/king0929zion/pikaso/commits/main)

            ---
            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          files: ./artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup after release
        if: always()
        run: |
          echo "Cleaning up artifacts..."
          rm -rf ./artifacts || true
          echo "Cleanup completed"
